<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1 maximum-scale=1, user-scalable=no"
    />
    <title>twiki</title>
    <style>
      #app-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      .loader {
        position: relative;
        width: 64px;
        height: 64px;
      }

      .loader svg {
        position: absolute;
        top: 0;
        animation-duration: 1.2s;
        animation-iteration-count: infinite;
        animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
      }

      .loader svg:first-child {
        right: 0px;
        animation-name: heartBeatFirstSegment;
      }

      .loader svg:last-child {
        left: 0px;
        animation-name: heartBeatSecondSegment;
      }

      @keyframes heartBeatSecondSegment {
        0% {
          transform: scale(1.15);
        }
        5% {
          transform: scale(1.3);
        }
        39% {
          transform: scale(1.05);
        }
        45% {
          transform: scale(1.2);
        }
        60% {
          transform: scale(1.15);
        }
        100% {
          transform: scale(1.1);
        }
      }

      @keyframes heartBeatFirstSegment {
        0% {
          transform: scale(1.1);
        }
        5% {
          transform: scale(1.15);
        }
        39% {
          transform: scale(1.2);
        }
        45% {
          transform: scale(1.05);
        }
        60% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1.15);
        }
      }
    </style>
  </head>
